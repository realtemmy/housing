_format_version: "3.0"

plugins:
  # GLOBAL PLUGINS
  - name: cors
    enabled: true
    config:
      origins: ["*"]
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      headers: ["Accept", "Content-Type", "Authorization", "Accept-Version", "Content-Length", "Content-MD5", "Date"]
      credentials: true
      max_age: 3600

services:
  # ---------------------------------------------------
  # AUTH SERVICE
  # ---------------------------------------------------
  - name: auth-service
    url: http://auth-service:4001/api
    routes:
      # PUBLIC: Login/Signup
      - name: auth-public
        paths:
          - /auth
        methods:
          - POST
        strip_path: false

      # PROTECTED: User Profile
      # DEFINITION of &jwt_policy happens here on the first protected route
      - name: user-protected
        paths:
          - /users
        methods:
          - GET
          - DELETE
        strip_path: false
        plugins:
          - &jwt_policy
            name: jwt
            enabled: true
            config:
              claims_to_verify:
                - exp
              header_names:
                - authorization

  # ---------------------------------------------------
  # BUILDING SERVICE
  # ---------------------------------------------------
  - name: building-service
    url: http://building-service:4002/api
    routes:
      # ==================
      # PROPERTIES
      # ==================
      
      # PUBLIC: READ (Covers /properties AND /properties/123)
      - name: public-properties-read
        paths:
          - /properties
        methods:
          - GET
        strip_path: false

      # PROTECTED: WRITE (Create)
      - name: protected-properties-create
        paths:
          - /properties
        methods:
          - POST
        strip_path: false
        plugins:
          - *jwt_policy

      # PROTECTED: WRITE (Update/Delete)
      - name: protected-properties-write
        paths:
          - /properties
        methods:
          - PATCH
          - DELETE
        strip_path: false
        plugins:
          - *jwt_policy

      # ==================
      # BUILDINGS
      # ==================

      # PUBLIC: READ
      - name: public-buildings-read
        paths:
          - /buildings
        methods:
          - GET   # <--- FIXED: Was POST
        strip_path: false

      # PROTECTED: CREATE
      - name: protected-buildings-create
        paths:
          - /buildings
        methods:
          - POST
        strip_path: false
        plugins:
          - *jwt_policy

      # PROTECTED: UPDATE/DELETE
      - name: protected-buildings-write
        paths:
          - /buildings
        methods:
          - PATCH
          - DELETE
        strip_path: false
        plugins:
          - *jwt_policy

      # ==================
      # UNITS
      # ==================

      # PUBLIC: READ (Covers /units, /units/123, /units/available)
      - name: public-units-read
        paths:
          - /units
        methods:
          - GET
        strip_path: false

      # PROTECTED: CREATE
      - name: protected-units-create
        paths:
          - /units
        methods:
          - POST
        strip_path: false
        plugins:
          - *jwt_policy

      # PROTECTED: UPDATE/DELETE
      - name: protected-units-write
        paths:
          - /units
        methods:
          - PATCH
          - DELETE
        strip_path: false
        plugins:
          - *jwt_policy

consumers:
  - username: global-user
    jwt_secrets:
      - key: auth-service-issuer
        algorithm: HS256
        secret: "a201a4e773401d9c72d9938d23ef70d85951a49445cee3bbcdc9a4e36dc71c329f4b58f3ace81e2012b027e82526d95c25a1e74aac987eece3c1359a0698d8c7"