_format_version: "3.0"

plugins:
  - name: cors
    enabled: true
    config:
      origins: ["*"]
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      headers:
        [
          Accept,
          Content-Type,
          Authorization,
          Accept-Version,
          Content-Length,
          Content-MD5,
          Date,
        ]
      credentials: true
      max_age: 3600

services:
  # ---------------------------------------------------
  # AUTH SERVICE
  # ---------------------------------------------------
  - name: auth-service
    url: http://auth-service:4001/api
    routes:
      # PUBLIC: Login/Signup
      - name: auth-public
        paths:
          - /auth
        methods:
          - POST
        strip_path: false

      # User Profile
      - name: user-protected
        paths:
          - /users/:id
        methods:
          - GET
          - DELETE
        strip_path: false
        plugins:
          - *jwt_policy
      
      - name: user-loggedIn
        paths:
          - /users/me
        strip_path: false
        plugins:
          - &jwt_policy
            name: jwt
            enabled: true
            config:
              claims_to_verify:
                - exp
              header_names:
                - authorization
    # ---------------------------------------------------
  # BUILDING SERVICE
  # ---------------------------------------------------
  - name: building-service
    url: http://building-service:4002/api
    routes:
      # PROPERTY SERVICE
      # ---------------------------------------------------
      # PUBLIC: Read-only
      - name: get-property # Get Property By ID
        paths:
          - /properties/:id
        methods:
          - GET
          - PATCH
          - DELETE
        strip_path: false


      # PROTECTED: Update/Delete
      - name: protected-properties-write
        paths:
          - /properties/:id
        methods:
          - PATCH
          - DELETE
        strip_path: false
        plugins:
          - *jwt_policy

      # PROTECTED: Create
      - name: protected-properties-create # Create Property
        paths:
          - /properties
        methods:
          - POST
        strip_path: false
        plugins:
          - *jwt_policy
      
      - name: public-properties-read # Get All Properties
        paths:
          - /properties
        methods:
          - GET
        strip_path: false
      # ---------------------------------------------------
      # BUILDING SERVICE
      # ---------------------------------------------------
      - name: get-building # Get Building By ID
        paths: 
          - /buildings/:id
        methods:
          - GET
        strip_path: false

      - name: protected-buildings-write # Update/Delete Building
        paths: 
          - /buildings/:id
        methods: 
          - PATCH
          - DELETE
        strip_path: false
        plugins: 
          - *jwt_policy
      
      - name: protected-buildings-create # Create Building
        paths: 
          - /buildings
        methods:
          - POST
        strip_path: false
        plugins:
          - *jwt_policy

      - name: public-buildings-read # Get All Buildings
        paths: 
          - /buildings
        methods:
          - POST
        strip_path: false
      
      # ---------------------------------------------------
      # UNIT SERVICE
      # ---------------------------------------------------
      - name: get-unit # Get Unit By ID
        paths: 
          - /units/:id
        methods:
          - GET
        strip_path: false

      - name: get-unit # Get Unit
        paths:
          - /units/:id
        methods: 
          - GET
        strip_path: false

      - name: protected-units-write # Update/Delete Unit
        paths: 
          - /units/:id
        methods: 
          - PATCH
          - DELETE
        strip_path: false
        plugins: 
          - *jwt_policy

      - name: public-units-read # Get Available Units
        paths:
          - /units/available
        methods:
          - GET
        strip_path: false
        
      - name: protected-units-create # Create Unit
        paths:
          - /units
        methods: 
          - POST
        strip_path: false
        plugins:
          - *jwt_policy
      

consumers:
  - username: global-user
    jwt_secrets:
      - key: auth-service-issuer
        algorithm: HS256
        secret: "a201a4e773401d9c72d9938d23ef70d85951a49445cee3bbcdc9a4e36dc71c329f4b58f3ace81e2012b027e82526d95c25a1e74aac987eece3c1359a0698d8c7"
