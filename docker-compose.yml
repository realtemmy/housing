services:
  # ---------------------------
  # THE GATEWAY
  # ---------------------------
  kong:
    image: kong:3.4
    container_name: api-gateway
    restart: always
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: debug
    volumes:
      - ./gateway:/usr/local/kong/declarative
    networks:
      - app-network

  # ---------------------------
  # INFRASTRUCTURE
  # ---------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1  # Fixed: Pinned version
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    networks:
      - app-network

  broker:
    image: confluentinc/cp-kafka:7.6.1
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    container_name: local-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Added MongoDB for Notification Service
  mongo:
    image: mongo:6.0
    container_name: local-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  # ---------------------------
  # SERVICES
  # ---------------------------
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    restart: on-failure
    command: npm run dev # Forces dev mode to avoid build errors
    depends_on:
      - broker
    environment:
      PORT: 4001
      # Using External NeonDB is fine here
      DATABASE_URL: postgresql://neondb_owner:npg_l68EILRHOiDa@ep-misty-unit-a4w4sus9-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAFKA_BROKER: "broker:29092"
      NODE_ENV: "development"
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    networks:
      - app-network

  # building-service:
  #   build: ./services/building-service
  #   container_name: building-service
  #   restart: on-failure
  #   command: npm run dev
  #   depends_on:
  #     - postgres
  #     - broker
  #   environment:
  #     PORT: 4002
  #     DATABASE_URL: "postgresql://postgres:password@postgres:5432/hm-buildings?schema=public"
  #     NODE_ENV: "development"
  #     KAFKA_BROKER: "broker:29092"
  #   networks:
  #     - app-network

  # lease-service:
  #   build: ./services/lease-service
  #   container_name: lease-service
  #   restart: on-failure
  #   command: npm run dev
  #   depends_on:
  #     - postgres
  #     - broker
  #   environment:
  #     PORT: 4003
  #     DATABASE_URL: "postgresql://postgres:password@postgres:5432/hm-leases?schema=public"
  #     NODE_ENV: "development"
  #     KAFKA_BROKER: "broker:29092"
  #   networks:
  #     - app-network

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    restart: on-failure
    command: npm run dev
    depends_on:
      - broker
      - mongo
    environment:
      PORT: 4004
      DATABASE_URL: "mongodb://mongo:27017/notification"
      NODE_ENV: "development"
      KAFKA_BROKER: "broker:29092"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data: # Added volume for Mongo persistence